apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment3
  labels:
    tier: frontend 
    app: nginx
spec:
  selector:
    matchLabels:
      app: depl3
  replicas: 5
  template:
    metadata:
      name: nginx-roll
      labels:
        app: depl3
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.1