apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment1
  labels:
    tier: frontend 
    app: nginx
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: 2
  template:
    metadata:
      name: nginx13
      labels:
        app: myapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.12