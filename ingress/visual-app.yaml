apiVersion: v1
kind: Namespace
metadata:
  name: visual-project
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: visual-web-html
  namespace: visual-project
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Welcome to DevOps!</title>
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com http://youtube.com; script-src 'self' https://www.youtube.com;">
        <style>
            body {
                background-color: #282c34;
                color: #61dafb;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 30px;
                text-align: center;
            }
            .video-container {
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                border-radius: 10px;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to DevOps!</h1>
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/WnJFQEHsSrU?si=SN4X84U1in9e5XV7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visual-web-deployment
  namespace: visual-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visual-web
  template:
    metadata:
      labels:
        app: visual-web
    spec:
      containers:
      - name: nginx-hello
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: visual-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: visual-web-service
  namespace: visual-project
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: visual-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visual-web-ingress
  namespace: visual-project
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: visual.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: visual-web-service
            port:
              number: 80


