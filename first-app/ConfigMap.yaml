apiVersion: v1
kind: ConfigMap
metadata:
  name: result-patch-script
  namespace: first-ns
data:
  patch.sh: |
    #!/bin/sh
    # Căutăm fișierele javascript ale aplicației și înlocuim textele vechi
    echo "Se aplică patch-ul pentru Chocolate și Chips..."
    cd /app
    # Înlocuim textul din fișierele html și js
    find . -type f -exec sed -i 's/Cats/Chocolate/g' {} +
    find . -type f -exec sed -i 's/Dogs/Chips/g' {} +
    # Pornim aplicația originală Node.js a containerului
    node server.js
