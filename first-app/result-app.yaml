apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-app
  namespace: first-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - name: result
        image: dockersamples/examplevotingapp_result:latest
        ports:
        - containerPort: 80
          name: result
        # Îi spunem containerului să execute scriptul nostru de modificare la pornire
        command: ["/bin/sh", "/tmp/patch/patch.sh"]
        volumeMounts:
        - name: script-volume
          mountPath: /tmp/patch
      volumes:
      - name: script-volume
        configMap:
          name: result-patch-script
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: first-ns
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31003
  selector:
    app: result
