apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-app
  namespace: first-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - name: result
        image: dockersamples/examplevotingapp_result:with-options
        ports:
        - containerPort: 80
          name: result
        env:
        - name: OPTION_A
          value: "Chocolate"
        - name: OPTION_B
          value: "Chips"
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: first-ns
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31003
  selector:
    app: result

