apiVersion: apps/v1
kind: Deployment
metadata: 
  name: voting-app
  namespace: first-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
    spec:
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote:before
        ports:
        - containerPort: 80
        env:
        - name: OPTION_A
          value: "Chocolate"
        - name: OPTION_B
          value: "Chips"

---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  namespace: first-app
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31013
  selector:
    app: voting-app
